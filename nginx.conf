server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these assets, so they can be cached across deployments.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fetch the latest entrypoint after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Let React Router resolve deep links, including /design/obsidienne.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
